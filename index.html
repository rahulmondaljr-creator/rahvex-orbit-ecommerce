<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbit — Glassmorphism E-Commerce UI (RAHVEX Free Demo)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #05070d; font-family: 'Segoe UI', system-ui, sans-serif; }
  .glass { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(14px); }
  .glow { box-shadow: 0 0 40px rgba(52,211,153,.25); }
</style>
</head>
<body class="text-slate-200">

<!-- NAV -->
<nav class="glass fixed top-0 inset-x-0 z-40">
  <div class="max-w-6xl mx-auto flex items-center justify-between px-4 h-14">
    <span class="font-bold text-lg">Orbit<span class="text-emerald-400">.</span></span>
    <button onclick="toggleCart()" class="glass relative rounded-xl px-4 py-2 text-sm">
      Cart
      <span id="cartCount" class="absolute -top-2 -right-2 bg-emerald-400 text-slate-950 text-xs font-bold rounded-full h-5 w-5 grid place-items-center">0</span>
    </button>
  </div>
</nav>

<!-- HERO -->
<header class="pt-28 pb-12 px-4 text-center">
  <span class="glass rounded-full px-4 py-1 text-xs text-emerald-400">Free demo by RAHVEX</span>
  <h1 class="text-4xl font-bold mt-4">Glassmorphism <span class="bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">Store UI</span></h1>
  <p class="text-slate-400 mt-2 max-w-md mx-auto text-sm">Product grid + working cart drawer. Edit freely and use in your projects.</p>
</header>

<!-- GRID -->
<main class="max-w-6xl mx-auto px-4 pb-24 grid grid-cols-2 md:grid-cols-3 gap-4" id="grid"></main>

<!-- CART DRAWER -->
<div id="overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/60 hidden z-40"></div>
<aside id="drawer" class="fixed top-0 right-0 h-full w-80 glass z-50 translate-x-full transition-transform duration-300 p-5">
  <div class="flex items-center justify-between mb-4">
    <h2 class="font-bold">Your cart</h2>
    <button onclick="toggleCart()" class="text-slate-400">✕</button>
  </div>
  <div id="cartItems" class="space-y-3 text-sm"></div>
  <div class="border-t border-white/10 mt-4 pt-3 flex justify-between font-bold">
    <span>Total</span><span id="cartTotal">$0</span>
  </div>
  <button class="w-full mt-4 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-bold py-3 glow">Checkout</button>
</aside>

<footer class="text-center text-xs text-slate-500 pb-8">
  Orbit E-Commerce UI — free demo &middot; More at <b>rahvex.vercel.app</b> &middot; IG: imrahulmondal___
</footer>

<script>
const products = [
  { name: "Aero Sneakers", price: 89, grad: "from-emerald-400/60 to-cyan-500/60" },
  { name: "Nebula Watch", price: 149, grad: "from-purple-500/60 to-blue-500/60" },
  { name: "Pulse Headphones", price: 79, grad: "from-pink-500/60 to-rose-500/60" },
  { name: "Vertex Backpack", price: 119, grad: "from-amber-400/60 to-orange-500/60" },
  { name: "Lumen Lamp", price: 59, grad: "from-cyan-400/60 to-sky-500/60" },
  { name: "Echo Speaker", price: 99, grad: "from-emerald-500/60 to-teal-500/60" },
];
let cart = [];

document.getElementById("grid").innerHTML = products.map((p, i) => `
  <div class="glass rounded-2xl p-4">
    <div class="h-32 rounded-xl bg-gradient-to-br ${p.grad}"></div>
    <h3 class="mt-3 font-semibold">${p.name}</h3>
    <div class="flex items-center justify-between mt-2">
      <span class="text-emerald-400 font-bold">$${p.price}</span>
      <button onclick="addToCart(${i})" class="text-xs rounded-lg bg-white/10 px-3 py-1.5 hover:bg-white/20">Add</button>
    </div>
  </div>`).join("");

function addToCart(i) { cart.push(products[i]); renderCart(); }
function renderCart() {
  document.getElementById("cartCount").textContent = cart.length;
  document.getElementById("cartItems").innerHTML = cart.length
    ? cart.map((p, i) => `<div class="flex justify-between glass rounded-lg px-3 py-2">
        <span>${p.name}</span>
        <span class="flex gap-2 items-center">$${p.price}
          <button onclick="cart.splice(${i},1);renderCart()" class="text-slate-500">✕</button>
        </span></div>`).join("")
    : `<p class="text-slate-500">Cart is empty.</p>`;
  document.getElementById("cartTotal").textContent = "$" + cart.reduce((s, p) => s + p.price, 0);
}
function toggleCart() {
  document.getElementById("drawer").classList.toggle("translate-x-full");
  document.getElementById("overlay").classList.toggle("hidden");
}
</script>
</body>
</html>
